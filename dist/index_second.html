<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Animation</title>
    <style>
      body { background: #181818; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 0; }
      .large { margin: 60px auto 0; text-align: center; font-size: 2.5rem; letter-spacing: 0.2em; }
      .large span { display: inline-block; min-width: 1ch; }
      /* Optimisation pour GitHub Pages */
      * { box-sizing: border-box; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
</head>
<body>
  <h2 class="large">
    <span>H</span>
    <span>E</span>
    <span>L</span>
    <span>L</span>
    <span>O</span>
    <span>&nbsp;</span>
    <span>W</span>
    <span>O</span>
    <span>R</span>
    <span>L</span>
    <span>D</span>
  </h2>
  <!-- Animation supprimée pour optimiser les performances sur GitHub Pages -->
</body>
</html>
