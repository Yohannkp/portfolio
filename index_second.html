<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime.js v4 Animation Example</title>
    <script src="https://cdn.jsdelivr.net/npm/animejs@4.0.2/lib/anime.iife.min.js"></script>
    <style>
      body { background: #181818; color: #fff; font-family: Inter, Arial, sans-serif; }
      .large { margin: 60px auto 0; text-align: center; font-size: 2.5rem; letter-spacing: 0.2em; }
      .large span { display: inline-block; min-width: 1ch; }
    </style>
</head>
<body>
  <h2 class="large">
    <span>H</span>
    <span>E</span>
    <span>L</span>
    <span>L</span>
    <span>O</span>
    <span>&nbsp;</span>
    <span>W</span>
    <span>O</span>
    <span>R</span>
    <span>L</span>
    <span>D</span>
  </h2>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.anime && window.anime.animate) {
        window.anime.animate('.large span', {
          y: [
            { to: '-2.75rem', ease: 'outExpo', duration: 600 },
            { to: 0, ease: 'outBounce', duration: 800, delay: 100 }
          ],
          rotate: {
            from: '-1turn',
            delay: 0
          },
          delay: (_, i) => i * 50,
          ease: 'inOutCirc',
          loopDelay: 1000,
          loop: true,
          direction: 'alternate'
        });
      }
    });
  </script>
</body>
</html>
