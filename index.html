    <style>
      :where([class^="ri-"])::before { content: "\f3c2"; }
      
      /* Base cyberpunk styles */
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #0A0A0A 0%, #1a0d2e 50%, #0A0A0A 100%);
        color: #e0e0e0;
        overflow-x: hidden;
      }
      
      /* Cyberpunk background images */
      .hero-bg-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
          radial-gradient(circle at 20% 80%, rgba(157, 78, 221, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(0, 245, 255, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 40% 40%, rgba(255, 16, 240, 0.2) 0%, transparent 50%);
        z-index: 1;
        animation: bgShift 10s ease-in-out infinite;
      }
      
      @keyframes bgShift {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      
      /* Cyberpunk cityscape silhouette */
      .cityscape-silhouette {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 200px;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200"><polygon fill="%239D4EDD" opacity="0.3" points="0,200 0,150 50,120 100,140 150,110 200,130 250,100 300,120 350,90 400,110 450,80 500,100 550,70 600,90 650,60 700,80 750,50 800,70 850,40 900,60 950,30 1000,50 1050,20 1100,40 1150,10 1200,30 1200,200"/></svg>') repeat-x;
        z-index: 2;
        animation: cityGlow 5s ease-in-out infinite alternate;
      }
      
      @keyframes cityGlow {
        0% { filter: drop-shadow(0 0 20px rgba(157, 78, 221, 0.5)); }
        100% { filter: drop-shadow(0 0 40px rgba(157, 78, 221, 0.8)); }
      }
      
      /* Neural network background pattern */
      .neural-network {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(circle at 20% 20%, #9D4EDD 2px, transparent 2px),
          radial-gradient(circle at 80% 80%, #00F5FF 2px, transparent 2px),
          radial-gradient(circle at 40% 60%, #FF10F0 1px, transparent 1px);
        background-size: 100px 100px, 150px 150px, 80px 80px;
        opacity: 0.3;
        animation: neuralPulse 8s ease-in-out infinite;
        z-index: 1;
      }
      
      @keyframes neuralPulse {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.02); }
      }
      
      @keyframes gridMove {
        0% { transform: translate(0, 0); }
        100% { transform: translate(50px, 50px); }
      }
      
      /* Glitch effect */
      @keyframes glitch {
        0%, 100% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
      }
      
      /* Neon pulse */
      @keyframes neonPulse {
        0% { 
          text-shadow: 
            0 0 5px #9D4EDD,
            0 0 10px #9D4EDD,
            0 0 15px #9D4EDD,
            0 0 20px #9D4EDD;
        }
        100% { 
          text-shadow: 
            0 0 2px #9D4EDD,
            0 0 5px #9D4EDD,
            0 0 8px #9D4EDD,
            0 0 12px #9D4EDD;
        }
      }
      
      /* Hologram effect */
      @keyframes hologram {
        0%, 100% { 
          background: linear-gradient(45deg, #9D4EDD, #00F5FF, #FF10F0);
          filter: hue-rotate(0deg);
        }
        33% { 
          filter: hue-rotate(120deg);
        }
        66% { 
          filter: hue-rotate(240deg);
        }
      }
      
      /* Cyber float animation */
      @keyframes cyberFloat {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(180deg); }
      }
      
      .text-gradient {
        background: linear-gradient(135deg, #9D4EDD, #00F5FF, #FF10F0);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-size: 200% 200%;
        animation: hologram 3s ease-in-out infinite;
        color: #9D4EDD; /* Fallback color */
      }
      
      /* Fix for text visibility */
      .text-gradient-visible {
        background: linear-gradient(135deg, #9D4EDD, #00F5FF, #FF10F0);
        background-clip: text;
        -webkit-background-clip: text;
        color: #9D4EDD;
        background-size: 200% 200%;
        animation: hologram 3s ease-in-out infinite;
        text-shadow: 0 0 20px rgba(157, 78, 221, 0.8);
      }
      
      .cyber-title {
        font-family: 'Orbitron', monospace;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 3px;
        animation: neon-pulse 2s ease-in-out infinite alternate;
        position: relative;
        z-index: 10;
      }
      
      /* Ensure title visibility */
      .hero-title-main {
        color: #9D4EDD !important;
        text-shadow: 
          0 0 10px #9D4EDD,
          0 0 20px #9D4EDD,
          0 0 30px #9D4EDD;
        font-size: 4rem !important;
        line-height: 1.1 !important;
        margin-bottom: 2rem !important;
      }
      
      .hero-title-accent {
        color: #00F5FF !important;
        text-shadow: 
          0 0 10px #00F5FF,
          0 0 20px #00F5FF,
          0 0 30px #00F5FF;
      }
      
      @media (max-width: 768px) {
        .hero-title-main {
          font-size: 2.5rem !important;
        }
      }
      
      .cyber-text {
        font-family: 'JetBrains Mono', monospace;
        color: #00F5FF;
      }
      
      .neon-border {
        border: 2px solid #9D4EDD;
        box-shadow: 
          0 0 5px #9D4EDD,
          inset 0 0 5px rgba(157, 78, 221, 0.2);
        animation: neon-pulse 2s ease-in-out infinite alternate;
      }
      
      .cyber-card {
        background: rgba(10, 10, 10, 0.8);
        border: 1px solid #9D4EDD;
        box-shadow: 
          0 0 20px rgba(157, 78, 221, 0.3),
          inset 0 0 20px rgba(157, 78, 221, 0.1);
        position: relative;
        overflow: hidden;
      }
      
      .cyber-card::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(45deg, #9D4EDD, #00F5FF, #FF10F0, #9D4EDD);
        background-size: 300% 300%;
        animation: hologram 3s ease-in-out infinite;
        z-index: -1;
        border-radius: inherit;
      }
      
      .cyber-button {
        background: linear-gradient(135deg, #9D4EDD, #00F5FF);
        border: none;
        color: #000;
        font-family: 'Orbitron', monospace;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 
          0 0 20px rgba(157, 78, 221, 0.5),
          inset 0 0 20px rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      
      .cyber-button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        transition: left 0.5s ease;
      }
      
      .cyber-button:hover::before {
        left: 100%;
      }
      
      .cyber-button:hover {
        transform: translateY(-2px);
        box-shadow: 
          0 5px 30px rgba(157, 78, 221, 0.7),
          inset 0 0 30px rgba(255, 255, 255, 0.2);
      }
      
      /* Matrix-style binary rain enhanced */
      .matrix-char {
        color: #39FF14;
        font-family: 'JetBrains Mono', monospace;
        text-shadow: 0 0 5px #39FF14;
        animation: matrixRain 3s linear infinite;
      }
      
      @keyframes matrixRain {
        0% { opacity: 1; transform: translateY(-100vh); }
        100% { opacity: 0; transform: translateY(100vh); }
      }
      
      /* Scan lines effect */
      .scan-lines::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          transparent 50%,
          rgba(0, 245, 255, 0.03) 50%
        );
        background-size: 100% 4px;
        pointer-events: none;
        animation: scanLines 0.1s linear infinite;
      }
      
      @keyframes scanLines {
        0% { transform: translateY(0); }
        100% { transform: translateY(4px); }
      }
      
      /* Cyber terminal styling */
      .cyber-terminal {
        background: rgba(10, 10, 10, 0.9);
        border: 1px solid #9D4EDD;
        border-radius: 4px;
        padding: 16px;
        box-shadow: 
          0 0 20px rgba(157, 78, 221, 0.3),
          inset 0 0 20px rgba(157, 78, 221, 0.1);
        position: relative;
      }
      
      .cyber-terminal::before {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        right: -1px;
        bottom: -1px;
        background: linear-gradient(45deg, #9D4EDD, #00F5FF, #FF10F0, #9D4EDD);
        background-size: 300% 300%;
        animation: hologram 3s ease-in-out infinite;
        z-index: -1;
        border-radius: inherit;
        opacity: 0.7;
      }
      
      .terminal-header {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        border-bottom: 1px solid rgba(157, 78, 221, 0.3);
        padding-bottom: 8px;
      }
      
      .terminal-content {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        line-height: 1.6;
      }
      
      .terminal-content div {
        opacity: 0;
        animation: terminalReveal 0.5s ease forwards;
      }
      
      .terminal-content div:nth-child(1) { animation-delay: 0.2s; }
      .terminal-content div:nth-child(2) { animation-delay: 0.4s; }
      .terminal-content div:nth-child(3) { animation-delay: 0.6s; }
      .terminal-content div:nth-child(4) { animation-delay: 0.8s; }
      
      @keyframes terminalReveal {
        from {
          opacity: 0;
          transform: translateX(-10px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      
      /* Enhanced typing cursor */
      .typing-cursor {
        font-family: 'JetBrains Mono', monospace;
        color: #00F5FF;
        text-shadow: 0 0 10px #00F5FF;
      }
      
      /* Responsive title adjustments */
      @media (max-width: 768px) {
        .cyber-title {
          font-size: 2.5rem !important;
          line-height: 1.2;
        }
        
        .cyber-terminal {
          padding: 12px;
        }
        
        .terminal-content {
          font-size: 12px;
        }
      }
      
      .text-gradient-old {
        background: linear-gradient(90deg, #2196F3, #03a9f4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .card {
        background: rgba(10, 10, 10, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid #9D4EDD;
        box-shadow: 
          0 0 20px rgba(157, 78, 221, 0.3),
          inset 0 0 20px rgba(157, 78, 221, 0.1);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      
      .card::before {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        right: -1px;
        bottom: -1px;
        background: linear-gradient(45deg, #9D4EDD, #00F5FF, #FF10F0, #9D4EDD);
        background-size: 300% 300%;
        animation: hologram 3s ease-in-out infinite;
        z-index: -1;
        border-radius: inherit;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      
      .card:hover::before {
        opacity: 1;
      }
      
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 
          0 10px 30px rgba(157, 78, 221, 0.5),
          inset 0 0 30px rgba(157, 78, 221, 0.2);
        border: 1px solid #00F5FF;
      }
      .progress-bar {
        height: 8px;
        background: rgba(10, 10, 10, 0.8);
        border: 1px solid #9D4EDD;
        border-radius: 4px;
        overflow: hidden;
        box-shadow: 
          inset 0 0 10px rgba(157, 78, 221, 0.3),
          0 0 5px rgba(157, 78, 221, 0.2);
      }
      
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #9D4EDD, #00F5FF, #FF10F0);
        background-size: 200% 100%;
        animation: hologram 3s ease-in-out infinite;
        border-radius: 3px;
        box-shadow: 0 0 10px rgba(157, 78, 221, 0.5);
        transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .slide-in {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      }
      .slide-in.active {
      opacity: 1;
      transform: translateY(0);
      }
      .timeline-item {
      position: relative;
      padding-left: 30px;
      margin-bottom: 20px;
      }
      .timeline-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 5px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #2196F3;
      }
      .timeline-item::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 20px;
      width: 2px;
      height: calc(100% + 10px);
      background: rgba(33, 150, 243, 0.3);
      }
      .timeline-item:last-child::after {
      display: none;
      }
      .project-card {
      background: rgba(30, 30, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      height: 100%;
      }
      .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(33, 150, 243, 0.3);
      }
      .tech-badge {
      background: rgba(33, 150, 243, 0.2);

      }
      .hamburger {

      height: 18px;
      position: relative;
      cursor: pointer;
      }
      .hamburger span {

      left: 0;
      transform: rotate(0deg);
      transition: .25s ease-in-out;

      .hamburger span:nth-child(1) {
      top: 0px;
      }
      .hamburger span:nth-child(2) {

      }
      .hamburger span:nth-child(3) {

      }
      .hamburger.open span:nth-child(2) {
      opacity: 0;

      }
      .hamburger.open span:nth-child(3) {

      .btn-download::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.7s ease;
      }
      .btn-download:hover::before {
      left: 100%;
      }
      .back-to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: #2196F3;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 100;
      }
      .back-to-top.visible {
      opacity: 1;
      visibility: visible;
      }
      .back-to-top:hover {
      transform: translateY(-5px);
      }
      .large span {
        display: inline-block;
        min-width: 1ch;
      }

      /* === MICRO-INTERACTIONS & ANIMATIONS === */
      
      /* Smooth transitions globales */
      * {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Hover effects avancés pour les boutons */
      .btn-primary {
        position: relative;
        overflow: hidden;
        transform: translateZ(0);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .btn-primary::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.6s ease;
      }
      
      .btn-primary:hover::before {
        left: 100%;
      }
      
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(33, 150, 243, 0.3);
      }
      
      .btn-primary:active {
        transform: translateY(0);
        transition: transform 0.1s ease;
      }

      /* Cards avec micro-interactions */
      .card {
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        overflow: hidden;
      }
      
      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, rgba(33, 150, 243, 0.1), rgba(3, 169, 244, 0.05));
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      
      .card:hover::before {
        opacity: 1;
      }

      /* Project cards avec effet parallax léger */
      .project-card {
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        overflow: hidden;
      }
      
      .project-card img {
        transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      
      .project-card:hover img {
        transform: scale(1.08);
      }

      /* Navigation links avec effet underline animé */
      .nav-link {
        position: relative;
        overflow: hidden;
      }
      
      .nav-link::after {
        content: "";
        position: absolute;
        bottom: -5px;
        left: 50%;
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, #2196F3, #03a9f4);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform: translateX(-50%);
      }
      
      .nav-link:hover::after,
      .nav-link.active::after {
        width: 100%;
      }

      /* Icons avec rotation subtile */
      .social-icon {
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
      }
      
      .social-icon::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        background: rgba(33, 150, 243, 0.2);
        border-radius: 50%;
        transition: all 0.3s ease;
        transform: translate(-50%, -50%);
        z-index: -1;
      }
      
      .social-icon:hover::before {
        width: 100%;
        height: 100%;
      }
      
      .social-icon:hover {
        transform: translateY(-3px) rotate(5deg);
        color: #2196F3;
      }

      /* Tech badges avec effet pulse */
      .tech-badge {
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
      }
      
      .tech-badge:hover {
        transform: translateY(-2px) scale(1.05);
        background: rgba(33, 150, 243, 0.3);
        box-shadow: 0 4px 12px rgba(33, 150, 243, 0.2);
      }

      /* Input focus avec effet glow */
      input:focus,
      textarea:focus {
        transform: translateY(-1px);
        box-shadow: 0 4px 20px rgba(33, 150, 243, 0.3);
      }

      /* Progress bars avec animation */
      .progress-fill {
        background: linear-gradient(90deg, #2196F3, #03a9f4, #2196F3);
        background-size: 200% 100%;
        animation: shimmer 2s infinite;
      }
      
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      /* Hamburger avec micro-interaction */
      .hamburger span {
        transform-origin: center;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      /* Back to top avec effet bounce */
      .back-to-top {
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      
      .back-to-top:hover {
        transform: translateY(-5px) scale(1.1);
        box-shadow: 0 8px 25px rgba(33, 150, 243, 0.4);
      }

      /* === TYPOGRAPHIE AMÉLIORÉE === */
      
      /* Hiérarchie typographique claire */
      h1 {
        font-size: clamp(2.5rem, 5vw, 4rem);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-bottom: 1.5rem;
      }
      
      h2 {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.01em;
        margin-bottom: 1.25rem;
      }
      
      h3 {
        font-size: clamp(1.5rem, 3vw, 2rem);
        font-weight: 600;
        line-height: 1.3;
        margin-bottom: 1rem;
      }
      
      h4 {
        font-size: clamp(1.25rem, 2.5vw, 1.5rem);
        font-weight: 500;
        line-height: 1.4;
        margin-bottom: 0.75rem;
      }

      /* Paragraphes avec meilleure lisibilité */
      p {
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 1rem;
        color: #e0e0e0;
      }
      
      .lead {
        font-size: 1.125rem;
        line-height: 1.7;
        font-weight: 400;
        color: #f5f5f5;
      }

      /* === ESPACEMENT COHÉRENT === */
      
      /* Variables CSS pour l'espacement */
      :root {
        --spacing-xs: 0.25rem;   /* 4px */
        --spacing-sm: 0.5rem;    /* 8px */
        --spacing-md: 1rem;      /* 16px */
        --spacing-lg: 1.5rem;    /* 24px */
        --spacing-xl: 2rem;      /* 32px */
        --spacing-2xl: 3rem;     /* 48px */
        --spacing-3xl: 4rem;     /* 64px */
        --spacing-4xl: 6rem;     /* 96px */
      }
      
      /* Sections avec espacement cohérent */
      section {
        padding: var(--spacing-4xl) 0;
      }
      
      @media (max-width: 768px) {
        section {
          padding: var(--spacing-3xl) 0;
        }
      }
      
      /* Container avec marges cohérentes */
      .container {
        padding-left: var(--spacing-md);
        padding-right: var(--spacing-md);
      }
      
      @media (min-width: 768px) {
        .container {
          padding-left: var(--spacing-lg);
          padding-right: var(--spacing-lg);
        }
      }
      
      /* Grilles avec gaps cohérents */
      .grid {
        gap: var(--spacing-xl);
      }
      
      @media (max-width: 768px) {
        .grid {
          gap: var(--spacing-lg);
        }
      }

      /* Cards avec padding cohérent */
      .card {
        padding: var(--spacing-xl);
      }
      
      @media (max-width: 768px) {
        .card {
          padding: var(--spacing-lg);
        }
      }

      /* Boutons avec espacement cohérent */
      .btn {
        padding: var(--spacing-md) var(--spacing-xl);
        margin: var(--spacing-sm);
      }

      /* Timeline avec espacement optimisé */
      .timeline-item {
        margin-bottom: var(--spacing-xl);
        padding-left: var(--spacing-2xl);
      }

      /* === ANIMATIONS D'ENTRÉE === */
      
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes fadeInLeft {
        from {
          opacity: 0;
          transform: translateX(-30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      
      @keyframes fadeInRight {
        from {
          opacity: 0;
          transform: translateX(30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* Animations avec delay pour effet cascade */
      .slide-in:nth-child(1) { animation-delay: 0.1s; }
      .slide-in:nth-child(2) { animation-delay: 0.2s; }
      .slide-in:nth-child(3) { animation-delay: 0.3s; }
      .slide-in:nth-child(4) { animation-delay: 0.4s; }

      /* === RESPONSIVE MICRO-INTERACTIONS === */
      
      @media (max-width: 768px) {
        /* Réduire les effets hover sur mobile */
        .card:hover {
          transform: translateY(-2px);
        }
        
        .project-card:hover img {
          transform: scale(1.02);
        }
        
        .btn-primary:hover {
          transform: translateY(-1px);
        }
      }

      /* === ACCESSIBILITÉ === */
      
      /* Respecter les préférences de mouvement réduit */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Focus visible pour l'accessibilité */
      *:focus-visible {
        outline: 2px solid #2196F3;
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* === LOGO AMÉLIORÉ === */
      
      .logo-header {
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      
      .logo-header:hover {
        transform: translateY(-1px);
      }
      
      .logo-icon {
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        overflow: hidden;
      }
      
      .logo-icon::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        transition: left 0.6s ease;
      }
      
      .logo-header:hover .logo-icon::before {
        left: 100%;
      }
      
      .logo-header:hover .logo-icon {
        transform: rotate(5deg) scale(1.05);
        box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4);
      }
      
      .logo-footer .logo-icon {
        transition: all 0.3s ease;
      }
      
      .logo-footer:hover .logo-icon {
        transform: rotate(-5deg) scale(1.1);
        box-shadow: 0 6px 20px rgba(33, 150, 243, 0.3);
      }

      /* === NOUVELLES ANIMATIONS JAVASCRIPT === */
      
      /* Typing Animation */
      .typing-cursor {
        display: inline-block;
        background-color: #2196F3;
        margin-left: 3px;
        width: 2px;
        animation: blink 1.2s infinite;
      }
      
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }

      /* Particules Canvas */
      #particles-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      /* Curseur personnalisé */
      .custom-cursor {
        position: fixed;
        width: 20px;
        height: 20px;
        background: rgba(33, 150, 243, 0.5);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transition: all 0.1s ease;
        transform: translate(-50%, -50%);
      }
      
      .custom-cursor.hover {
        transform: translate(-50%, -50%) scale(2);
        background: rgba(33, 150, 243, 0.8);
      }

      /* Floating Elements */
      .floating-element {
        position: absolute;
        opacity: 0.1;
        animation: float 6s ease-in-out infinite;
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(180deg); }
      }

      /* Reveal Animation */
      .reveal-element {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
        transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      
      .reveal-element.revealed {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      /* Parallax Sections */
      .parallax-bg {
        transform: translateZ(0);
        will-change: transform;
      }

      /* Count Up Animation */
      .count-up {
        font-feature-settings: 'tnum';
        font-variant-numeric: tabular-nums;
      }

      /* Glitch Effect */
      .glitch {
        position: relative;
        animation: glitch 2s infinite;
      }
      
      @keyframes glitch {
        0%, 100% { transform: translate(0); }
        10% { transform: translate(-2px, -2px); }
        20% { transform: translate(2px, 2px); }
        30% { transform: translate(-2px, 2px); }
        40% { transform: translate(2px, -2px); }
        50% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        70% { transform: translate(-2px, 2px); }
        80% { transform: translate(2px, -2px); }
        90% { transform: translate(-2px, -2px); }
      }

      /* Matrix Rain Effect */
      .matrix-rain {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
      }
      
      .matrix-char {
        position: absolute;
        color: #00ff00;
        font-family: 'Courier New', monospace;
        font-size: 14px;
        animation: matrix-fall 3s linear infinite;
      }
      
      @keyframes matrix-fall {
        0% { top: -20px; opacity: 1; }
        100% { top: 100vh; opacity: 0; }
      }

      /* Magnetic Effect */
      .magnetic {
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      /* Loading Bar */
      .loading-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 0%;
        height: 3px;
        background: linear-gradient(90deg, #2196F3, #03a9f4);
        z-index: 10000;
        transition: width 0.3s ease;
      }

      /* Scroll Progress */
      .scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        width: 0%;
        height: 3px;
        background: linear-gradient(90deg, #2196F3, #03a9f4);
        z-index: 1000;
        transition: width 0.1s ease;
      }

      /* === NOUVELLES ANIMATIONS CRÉATIVES === */
      
      /* Wave Animation pour séparateurs de sections */
      .wave-separator {
        position: relative;
        height: 100px;
        overflow: hidden;
      }
      
      .wave-separator svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        animation: wave 3s ease-in-out infinite;
      }
      
      @keyframes wave {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-25px); }
      }

      /* Morphing Background Shapes */
      .morphing-bg {
        position: absolute;
        width: 300px;
        height: 300px;
        background: linear-gradient(45deg, rgba(33, 150, 243, 0.1), rgba(3, 169, 244, 0.05));
        border-radius: 50%;
        animation: morph 8s ease-in-out infinite;
        z-index: -1;
      }
      
      @keyframes morph {
        0%, 100% { 
          border-radius: 50% 50% 50% 50%;
          transform: rotate(0deg) scale(1);
        }
        25% { 
          border-radius: 60% 40% 30% 70%;
          transform: rotate(90deg) scale(1.1);
        }
        50% { 
          border-radius: 30% 70% 70% 30%;
          transform: rotate(180deg) scale(0.9);
        }
        75% { 
          border-radius: 70% 30% 50% 50%;
          transform: rotate(270deg) scale(1.05);
        }
      }

      /* Text Reveal avec masque */
      .text-reveal {
        overflow: hidden;
        position: relative;
      }
      
      .text-reveal::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #121212;
        animation: textReveal 1.5s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        z-index: 1;
      }
      
      @keyframes textReveal {
        0% { width: 100%; }
        100% { width: 0%; }
      }

      /* Elastic Cards */
      .elastic-card {
        transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      
      .elastic-card:hover {
        transform: scale(1.05) rotate(2deg);
      }

      /* Typing Sound Effect (visual) */
      .typing-sound {
        position: relative;
      }
      
      .typing-sound::after {
        content: '';
        position: absolute;
        top: 50%;
        right: -30px;
        width: 20px;
        height: 20px;
        background: radial-gradient(circle, rgba(33, 150, 243, 0.6) 0%, transparent 70%);
        border-radius: 50%;
        animation: soundWave 0.1s ease-in-out;
      }
      
      @keyframes soundWave {
        0% { transform: scale(0.8); opacity: 1; }
        100% { transform: scale(1.2); opacity: 0; }
      }

      /* Matrix Binary Rain */
      .binary-rain {
        position: absolute;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: #00ff00;
        opacity: 0.3;
        animation: binaryFall linear infinite;
        z-index: 1;
      }
      
      @keyframes binaryFall {
        0% { transform: translateY(-100vh); }
        100% { transform: translateY(100vh); }
      }

      /* 3D Card Flip Effect - Corrigé */
      .flip-card {
        perspective: 1000px;
        width: 100%;
        height: 200px;
      }
      
      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.6s ease-in-out;
        transform-style: preserve-3d;
      }
      
      .flip-card:hover .flip-card-inner {
        transform: rotateY(180deg);
      }
      
      .flip-card-front, .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }
      
      .flip-card-front {
        z-index: 2;
        transform: rotateY(0deg);
      }
      
      .flip-card-back {
        transform: rotateY(180deg);
        background: linear-gradient(135deg, 
          rgba(21, 21, 21, 0.95), 
          rgba(33, 150, 243, 0.3),
          rgba(0, 245, 255, 0.2)
        );
        border: 2px solid rgba(0, 245, 255, 0.5);
        backdrop-filter: blur(15px);
        color: white;
        box-shadow: 
          inset 0 0 30px rgba(0, 245, 255, 0.2),
          0 0 40px rgba(0, 245, 255, 0.3);
      }

      /* Style amélioré pour le contenu des cartes */
      .flip-card-back .cyber-text {
        color: #FFFFFF;
        font-family: 'Courier New', monospace;
        line-height: 1.6;
        text-shadow: 
          0 0 5px rgba(255, 255, 255, 0.8),
          0 0 10px rgba(0, 245, 255, 0.6);
        font-weight: 600;
        width: 100%;
      }

      .flip-card-back h3 {
        margin-bottom: 15px;
        text-shadow: 
          0 0 10px currentColor,
          0 0 20px currentColor;
        font-size: 1.1rem;
        font-weight: 700;
      }

      /* Tech items toujours visibles avec meilleur contraste */
      .flip-card-back .tech-item {
        opacity: 1 !important;
        transform: translateX(0) !important;
        position: relative;
        padding-left: 25px;
        margin: 10px 0;
        font-weight: 700;
        text-shadow: 
          0 0 3px #000000,
          0 0 8px currentColor,
          0 0 15px rgba(255, 255, 255, 0.5);
        font-size: 0.9rem;
        transition: all 0.3s ease;
      }

      /* Puces toujours visibles */
      .flip-card-back .tech-item::before {
        content: '▶';
        position: absolute;
        left: 0;
        color: currentColor;
        animation: pulse 2s infinite;
        text-shadow: 
          0 0 5px currentColor,
          0 0 10px currentColor;
        font-weight: bold;
      }

      /* Effet hover sur les tech items */
      .flip-card-back .tech-item:hover {
        transform: translateX(5px);
        text-shadow: 
          0 0 5px #000000,
          0 0 15px currentColor,
          0 0 25px rgba(255, 255, 255, 0.8);
      }

      /* Effet de survol amélioré pour les cartes */
      .flip-card:hover {
        transform: translateY(-8px);
        transition: transform 0.3s ease;
      }

      .flip-card:hover .neon-border {
        box-shadow: 
          0 0 30px rgba(0, 245, 255, 0.8),
          0 0 60px rgba(0, 245, 255, 0.6),
          0 0 90px rgba(0, 245, 255, 0.4);
      }

      /* Neon Glow Effect */
      .neon-glow {
        position: relative;
        color: #fff;
        text-shadow: 
          0 0 5px #2196F3,
          0 0 10px #2196F3,
          0 0 15px #2196F3,
          0 0 20px #2196F3;
        animation: neonFlicker 2s infinite alternate;
      }
      
      @keyframes neonFlicker {
        0%, 18%, 22%, 25%, 53%, 57%, 100% {
          text-shadow: 
            0 0 5px #2196F3,
            0 0 10px #2196F3,
            0 0 15px #2196F3,
            0 0 20px #2196F3;
        }
        20%, 24%, 55% {
          text-shadow: none;
        }
      }

      /* Liquid Loading Effect */
      .liquid-loader {
        position: relative;
        width: 100px;
        height: 100px;
        margin: 0 auto;
      }
      
      .liquid-loader::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: linear-gradient(45deg, #2196F3, #03a9f4);
        animation: liquidPulse 2s ease-in-out infinite;
      }
      
      @keyframes liquidPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
      }

      /* Staggered Slide Animation */
      .stagger-item {
        opacity: 0;
        transform: translateY(30px);
        animation: staggerSlide 0.6s ease forwards;
      }
      
      .stagger-item:nth-child(1) { animation-delay: 0.1s; }
      .stagger-item:nth-child(2) { animation-delay: 0.2s; }
      .stagger-item:nth-child(3) { animation-delay: 0.3s; }
      .stagger-item:nth-child(4) { animation-delay: 0.4s; }
      .stagger-item:nth-child(5) { animation-delay: 0.5s; }
      
      @keyframes staggerSlide {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Breathing Animation */
      .breathing {
        animation: breathe 4s ease-in-out infinite;
      }
      
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      /* DNA Helix Animation */
      .dna-helix {
        position: relative;
        width: 4px;
        height: 100px;
        background: linear-gradient(to bottom, #2196F3, #03a9f4);
        margin: 0 auto;
        animation: dnaRotate 3s linear infinite;
      }
      
      .dna-helix::before,
      .dna-helix::after {
        content: '';
        position: absolute;
        width: 8px;
        height: 8px;
        background: #2196F3;
        border-radius: 50%;
        animation: dnaBubble 3s linear infinite;
      }
      
      .dna-helix::before {
        left: -10px;
        animation-delay: 0s;
      }
      
      .dna-helix::after {
        right: -10px;
        animation-delay: 1.5s;
      }
      
      @keyframes dnaRotate {
        0% { transform: rotateY(0deg); }
        100% { transform: rotateY(360deg); }
      }
      
      @keyframes dnaBubble {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-80px); }
      }

      /* Holographic Text Effect */
      .holographic {
        background: linear-gradient(45deg, #ff006e, #2196F3, #00f5ff, #ff006e);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: holographicShift 3s ease-in-out infinite;
      }
      
      @keyframes holographicShift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }

      /* Radar Scanning Effect */
      .radar-scan {
        position: relative;
        width: 200px;
        height: 200px;
        border: 2px solid #2196F3;
        border-radius: 50%;
        margin: 0 auto;
      }
      
      .radar-scan::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 2px;
        height: 50%;
        background: #2196F3;
        transform-origin: bottom center;
        animation: radarSweep 2s linear infinite;
      }
      
      @keyframes radarSweep {
        0% { transform: translate(-50%, -100%) rotate(0deg); }
        100% { transform: translate(-50%, -100%) rotate(360deg); }
      }
      
      /* Effets cyberpunk améliorés */
      .cyber-avatar-container {
        position: relative;
        filter: drop-shadow(0 0 20px rgba(157, 78, 221, 0.5));
      }

      .cyber-logo-enhanced {
        position: relative;
        transition: all 0.3s ease;
      }

      .cyber-glitch-overlay {
        animation: glitchOverlay 2s linear infinite;
      }

      .floating-data-point {
        position: relative;
        transition: all 0.3s ease;
      }

      .floating-data-point::before {
        content: attr(data-binary);
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 8px;
        color: #00F5FF;
        opacity: 0.7;
        font-family: 'JetBrains Mono', monospace;
      }

      .cyber-hud-overlay {
        pointer-events: none;
      }

      .cyber-hud-element {
        display: flex;
        align-items: center;
        gap: 8px;
        animation: hudPulse 2s ease-in-out infinite alternate;
      }

      .cyber-bracket-left::before {
        content: '┌─';
        color: currentColor;
        font-family: 'JetBrains Mono', monospace;
      }

      .cyber-bracket-right::after {
        content: '─┐';
        color: currentColor;
        font-family: 'JetBrains Mono', monospace;
      }

      .cyber-card-hud {
        pointer-events: none;
        opacity: 0.3;
        transition: opacity 0.3s ease;
      }

      .cyber-card:hover .cyber-card-hud {
        opacity: 0.6;
      }

      .cyber-progress-bar {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
      }

      .cyber-progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #9D4EDD, #00F5FF, #FF10F0);
        background-size: 200% 100%;
        border-radius: 3px;
        position: relative;
        animation: progressGlow 2s linear infinite;
        transition: width 1s ease;
      }

      .cyber-progress-fill::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        animation: progressScan 2s linear infinite;
      }

      /* Animations cyberpunk */
      @keyframes glitchOverlay {
        0%, 90% { transform: translate(0); opacity: 0; }
        91%, 93% { transform: translate(-2px, 1px); opacity: 0.7; }
        94%, 96% { transform: translate(1px, -1px); opacity: 0.5; }
        97%, 100% { transform: translate(0); opacity: 0; }
      }

      @keyframes hudPulse {
        0% { opacity: 0.5; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.05); }
      }

      @keyframes progressGlow {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      @keyframes progressScan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      @keyframes hologramScan {
        0% { transform: translateY(-100%); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(100vh); opacity: 0; }
      }

      @keyframes cyber-float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        33% { transform: translateY(-10px) rotate(2deg); }
        66% { transform: translateY(5px) rotate(-1deg); }
      }

      /* Effets de particules */
      #cyberpunk-particles {
        mix-blend-mode: screen;
      }

      /* Améliorations des cartes */
      .card {
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #00F5FF, transparent);
        animation: cardScan 3s linear infinite;
      }

      @keyframes cardScan {
        0% { left: -100%; }
        100% { left: 100%; }
      }

      /* Effets de texte cyberpunk */
      .cyber-text {
        position: relative;
        transition: all 0.3s ease;
      }

      .cyber-text::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(45deg, transparent 30%, rgba(0, 245, 255, 0.1) 50%, transparent 70%);
        opacity: 0;
        animation: textScan 3s ease-in-out infinite;
      }

      @keyframes textScan {
        0%, 90% { opacity: 0; transform: translateX(-100%); }
        95% { opacity: 1; transform: translateX(0%); }
        100% { opacity: 0; transform: translateX(100%); }
      }

      /* Status indicator amélioré */
      .animate-cyber-float {
        animation: cyber-float 3s ease-in-out infinite;
      }

      /* Debug des cartes flip */
        function debugFlipCards() {
          console.log('🎮 Initialisation du debug des cartes flip...');
          
          const flipCards = document.querySelectorAll('.flip-card');
          console.log(`📱 ${flipCards.length} cartes flip trouvées`);
          
          flipCards.forEach((card, index) => {
            const front = card.querySelector('.flip-card-front');
            const back = card.querySelector('.flip-card-back');
            const techItems = back.querySelectorAll('.tech-item');
            
            console.log(`🔍 Carte ${index + 1}:`);
            console.log(`  - Face avant: ${front ? '✅' : '❌'}`);
            console.log(`  - Face arrière: ${back ? '✅' : '❌'}`);
            console.log(`  - Tech items: ${techItems.length}`);
            
            // Test de visibilité du contenu
            if (back) {
              const backStyles = window.getComputedStyle(back);
              console.log(`  - Background: ${backStyles.background}`);
              console.log(`  - Color: ${backStyles.color}`);
            }
            
            // Ajouter des événements de debug
            card.addEventListener('mouseenter', () => {
              console.log(`🖱️ Hover sur carte ${index + 1}`);
              
              // Force l'affichage du contenu
              techItems.forEach(item => {
                item.style.opacity = '1';
                item.style.transform = 'translateX(0)';
              });
            });
            
            card.addEventListener('mouseleave', () => {
              console.log(`🖱️ Sortie hover carte ${index + 1}`);
            });
          });
        }

        // ...existing code...
    </script>
  </body>
</html>
